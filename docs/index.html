<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>וינה — המלצות אוכל מ-TimeOut</title>
<link rel="preconnect" href="https://media.timeout.com">
<style>
  :root{
    --bg:#f4f4f2; --card:#fff; --text:#1b1b1b; --muted:#6c6f74; --accent:#c8102e;
    --border:#e3e4e6; --chip:#ececee; --shadow:0 1px 3px rgba(0,0,0,.07);
  }
  [data-theme="dark"]{
    --bg:#151515; --card:#1f1f1f; --text:#eeeeea; --muted:#9b9b9b; --accent:#ff5f6d;
    --border:#2e2e2e; --chip:#282828; --shadow:0 1px 3px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:"Segoe UI","Heebo",Arial,sans-serif; line-height:1.5;
  }
  .wrap{max-width:1180px; margin:0 auto; padding:18px 16px 60px}

  header{display:flex; align-items:flex-start; gap:12px; margin-bottom:6px}
  h1{font-size:1.65rem; margin:0; letter-spacing:-.4px}
  h1 span{color:var(--accent)}
  .sub{color:var(--muted); font-size:.85rem; margin:4px 0 0}
  .hdr-btns{margin-inline-start:auto; display:flex; gap:8px}
  .icon-btn{
    border:1px solid var(--border); background:var(--card); color:var(--text);
    border-radius:11px; padding:9px 12px; cursor:pointer; font-size:.95rem;
    font-family:inherit; text-decoration:none; box-shadow:var(--shadow);
  }

  .controls{margin:16px 0 4px; display:flex; flex-direction:column; gap:10px}
  .views{display:flex; gap:7px; flex-wrap:wrap}
  .viewbtn{
    border:1px solid var(--border); background:var(--card); color:var(--text);
    border-radius:11px; padding:9px 14px; font-size:.88rem; font-weight:600;
    cursor:pointer; font-family:inherit; text-decoration:none; box-shadow:var(--shadow);
  }
  .viewbtn.on{background:var(--accent); color:#fff; border-color:var(--accent)}
  #search{
    width:100%; padding:11px 14px; border-radius:11px; font-size:.92rem;
    border:1px solid var(--border); background:var(--card); color:var(--text);
    font-family:inherit;
  }
  .filters{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
  .chip{
    border:1px solid var(--border); background:var(--chip); color:var(--text);
    border-radius:999px; padding:6px 13px; font-size:.82rem; cursor:pointer;
    font-family:inherit;
  }
  .chip.on{background:var(--accent); color:#fff; border-color:var(--accent)}
  select{
    border:1px solid var(--border); background:var(--card); color:var(--text);
    border-radius:11px; padding:8px 11px; font-size:.82rem; font-family:inherit;
  }
  .count{color:var(--muted); font-size:.82rem; margin:10px 2px}

  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(285px,1fr)); gap:15px}
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:15px;
    overflow:hidden; box-shadow:var(--shadow); display:flex; flex-direction:column;
    position:relative;
  }
  .card img{width:100%; height:165px; object-fit:cover; display:block; background:var(--chip)}
  .card-body{padding:13px 15px 15px; display:flex; flex-direction:column; gap:7px; flex:1}
  .name{font-size:1.08rem; font-weight:700; margin:0; padding-inline-end:30px}
  .type{color:var(--accent); font-size:.78rem; font-weight:700}
  .row{font-size:.84rem; color:var(--text)}
  .row b{font-weight:600; color:var(--muted); font-weight:600}
  .desc{font-size:.84rem; color:var(--muted)}
  .tip{font-size:.82rem; background:var(--chip); border-radius:9px; padding:8px 10px}
  .links{margin-top:auto; padding-top:9px; display:flex; gap:12px; font-size:.81rem}
  .links a{color:var(--accent); font-weight:600; text-decoration:none}
  .fav{
    position:absolute; top:10px; inset-inline-end:10px; z-index:2;
    background:rgba(0,0,0,.45); border:0; border-radius:50%; width:33px; height:33px;
    cursor:pointer; font-size:1rem; color:#fff; line-height:1;
  }
  .card.nopic .fav{background:var(--chip); color:var(--muted)}
  .fav.on{color:#ff4d5a}
  .badge{
    display:inline-block; background:var(--accent); color:#fff; font-size:.68rem;
    font-weight:700; border-radius:6px; padding:2px 7px; margin-inline-start:6px;
    vertical-align:middle;
  }

  .article-group{margin-bottom:28px}
  .article-head{
    background:var(--card); border:1px solid var(--border); border-radius:13px;
    padding:13px 16px; margin-bottom:13px; box-shadow:var(--shadow);
  }
  .article-head h2{margin:0; font-size:1.05rem}
  .article-head a{color:var(--text); text-decoration:none}
  .article-head .meta{color:var(--muted); font-size:.79rem; margin-top:3px}

  .empty{text-align:center; color:var(--muted); padding:50px 20px}
  footer{text-align:center; color:var(--muted); font-size:.75rem; margin-top:38px}

  @media (max-width:600px){
    .wrap{padding:14px 11px 50px}
    h1{font-size:1.3rem}
    .grid{grid-template-columns:1fr; gap:13px}
    .card img{height:190px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>וינה <span>·</span> המלצות אוכל</h1>
      <p class="sub" id="sub">טוען…</p>
    </div>
    <div class="hdr-btns">
      <a class="icon-btn" href="map.html" title="מפה">🗺️</a>
      <button class="icon-btn" id="themeBtn" title="מצב כהה/בהיר">🌙</button>
    </div>
  </header>

  <div class="controls">
    <div class="views">
      <button class="viewbtn on" data-view="articles">📰 לפי כתבה</button>
      <button class="viewbtn" data-view="places">🍽️ לפי מסעדה</button>
      <button class="viewbtn" data-view="favs">❤️ מועדפים <span id="favCount"></span></button>
    </div>
    <input id="search" placeholder="חיפוש מקום, מנה, רחוב או רובע…">
    <div class="filters">
      <div class="chips" id="typeChips" style="display:flex;gap:7px;flex-wrap:wrap"></div>
      <select id="districtSel"><option value="">כל הרובעים</option></select>
    </div>
  </div>

  <div class="count" id="count"></div>
  <div id="out"></div>

  <footer>
    כל ההמלצות מתוך <a href="https://www.timeout.com/vienna" target="_blank" style="color:var(--muted)">TimeOut Vienna</a>
    · לשימוש אישי · <span id="lastRun"></span>
  </footer>
</div>

<script>
const NS = "לא צוין";
const state = { view: "articles", q: "", type: "", district: "", data: null };
const favs = new Set(JSON.parse(localStorage.getItem("vienna_favs") || "[]"));

const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, m =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
const has = v => v && v !== NS;
const keyOf = c => c.name.trim().toLowerCase();

/* ---------- ערכת נושא ---------- */
const savedTheme = localStorage.getItem("vienna_theme");
document.documentElement.dataset.theme =
  savedTheme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
document.getElementById("themeBtn").onclick = () => {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  localStorage.setItem("vienna_theme", next);
};

/* ---------- טעינה ---------- */
fetch("data.json?t=" + Date.now()).then(r => r.json()).then(d => {
  state.data = d;
  document.getElementById("sub").textContent =
    `${d.cards.length} מקומות · ${d.articles.length} מדריכים של TimeOut`;
  if (d.last_run) {
    document.getElementById("lastRun").textContent =
      "עודכן " + new Date(d.last_run).toLocaleDateString("he-IL");
  }
  buildFilters();
  render();
}).catch(() => {
  document.getElementById("out").innerHTML =
    '<div class="empty">לא הצלחתי לטעון את הנתונים</div>';
});

function buildFilters() {
  const types = [...new Set(state.data.cards.map(c => c.type))].sort();
  const box = document.getElementById("typeChips");
  box.innerHTML = `<button class="chip on" data-type="">הכל</button>` +
    types.map(t => `<button class="chip" data-type="${esc(t)}">${esc(t)}</button>`).join("");
  box.onclick = e => {
    const b = e.target.closest(".chip");
    if (!b) return;
    state.type = b.dataset.type;
    [...box.children].forEach(c => c.classList.toggle("on", c === b));
    render();
  };

  const districts = [...new Set(state.data.cards.map(c => c.district_name).filter(has))].sort();
  const sel = document.getElementById("districtSel");
  districts.forEach(d => {
    const card = state.data.cards.find(c => c.district_name === d);
    sel.insertAdjacentHTML("beforeend",
      `<option value="${esc(d)}">${card.district ? card.district + ". " : ""}${esc(d)}</option>`);
  });
  sel.onchange = () => { state.district = sel.value; render(); };
}

document.querySelector(".views").onclick = e => {
  const b = e.target.closest(".viewbtn");
  if (!b) return;
  state.view = b.dataset.view;
  document.querySelectorAll(".viewbtn").forEach(x => x.classList.toggle("on", x === b));
  render();
};
document.getElementById("search").oninput = e => {
  state.q = e.target.value.trim().toLowerCase();
  render();
};

/* ---------- סינון ---------- */
function filtered() {
  return state.data.cards.filter(c => {
    if (state.type && c.type !== state.type) return false;
    if (state.district && c.district_name !== state.district) return false;
    if (state.view === "favs" && !favs.has(keyOf(c))) return false;
    if (state.q) {
      const hay = [c.name, c.type, c.description, c.what_to_eat, c.address,
                   c.district_name, c.tip, c.article_title].join(" ").toLowerCase();
      if (!hay.includes(state.q)) return false;
    }
    return true;
  });
}

/* ---------- כרטיס ---------- */
function cardHtml(c) {
  const k = keyOf(c);
  const gmaps = "https://www.google.com/maps/search/" +
    encodeURIComponent(c.name + ", " + (has(c.address) ? c.address + ", " : "") + "Vienna");
  const place = [has(c.address) ? c.address : "", has(c.district_name) ? c.district_name : ""]
    .filter(Boolean).join(" · ");
  return `
  <div class="card${c.photo ? "" : " nopic"}">
    <button class="fav${favs.has(k) ? " on" : ""}" data-k="${esc(k)}"
            title="מועדפים">${favs.has(k) ? "♥" : "♡"}</button>
    ${c.photo ? `<img loading="lazy" src="${esc(c.photo)}" alt="${esc(c.name)}"
        onerror="this.closest('.card').classList.add('nopic'); this.remove();">` : ""}
    <div class="card-body">
      <h3 class="name">${esc(c.name)}${c.is_new ? '<span class="badge">חדש</span>' : ""}</h3>
      <div class="type">${esc(c.type)}</div>
      ${has(c.description) ? `<div class="desc">${esc(c.description)}</div>` : ""}
      ${has(c.what_to_eat) ? `<div class="row"><b>למה ללכת:</b> ${esc(c.what_to_eat)}</div>` : ""}
      ${has(c.hours) ? `<div class="row"><b>שעות:</b> ${esc(c.hours)}</div>` : ""}
      ${place ? `<div class="row"><b>כתובת:</b> ${esc(place)}</div>` : ""}
      ${has(c.price) ? `<div class="row"><b>מחיר:</b> ${esc(c.price)}</div>` : ""}
      ${has(c.tip) ? `<div class="tip">💡 ${esc(c.tip)}</div>` : ""}
      <div class="links">
        <a href="${esc(c.article_url)}" target="_blank">לכתבה ↗</a>
        <a href="${gmaps}" target="_blank">גוגל מפות ↗</a>
      </div>
    </div>
  </div>`;
}

/* ---------- תצוגה ---------- */
function render() {
  const out = document.getElementById("out");
  const list = filtered();
  document.getElementById("favCount").textContent = favs.size ? `(${favs.size})` : "";
  document.getElementById("count").textContent =
    list.length ? `${list.length} מקומות` : "";

  if (!list.length) {
    out.innerHTML = `<div class="empty">${
      state.view === "favs" && !favs.size
        ? "עוד לא סימנת מועדפים. לחץ על הלב שבפינת כרטיס."
        : "לא נמצאו מקומות שמתאימים לסינון."}</div>`;
    return;
  }

  if (state.view === "articles") {
    const groups = new Map();
    list.forEach(c => {
      if (!groups.has(c.article_url)) groups.set(c.article_url, []);
      groups.get(c.article_url).push(c);
    });
    out.innerHTML = [...groups.entries()].map(([url, cards]) => {
      const a = cards[0];
      const date = a.article_date
        ? new Date(a.article_date).toLocaleDateString("he-IL", { year: "numeric", month: "long" })
        : "";
      return `<section class="article-group">
        <div class="article-head">
          <h2><a href="${esc(url)}" target="_blank">${esc(a.article_title)} ↗</a></h2>
          <div class="meta">${cards.length} מקומות${date ? " · עודכן " + date : ""}</div>
        </div>
        <div class="grid">${cards.map(cardHtml).join("")}</div>
      </section>`;
    }).join("");
  } else {
    out.innerHTML = `<div class="grid">${list.map(cardHtml).join("")}</div>`;
  }
}

/* ---------- מועדפים ---------- */
document.getElementById("out").onclick = e => {
  const b = e.target.closest(".fav");
  if (!b) return;
  const k = b.dataset.k;
  favs.has(k) ? favs.delete(k) : favs.add(k);
  localStorage.setItem("vienna_favs", JSON.stringify([...favs]));
  render();
};
</script>
</body>
</html>
