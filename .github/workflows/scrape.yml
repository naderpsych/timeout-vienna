name: סריקת וינה

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: vienna
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: התקנת תלויות
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: סריקת המדריכים
        run: python scraper.py

      - name: השלמת כתובות, שעות ומיקומים
        run: python enrich.py 40

      - name: שמירת עדכונים
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if git diff --cached --quiet; then
            echo "אין שינויים"
          else
            git commit -m "עדכון אוטומטי ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: התרעה על תקלה
        if: failure()
        uses: actions/github-script@v7
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const NL = String.fromCharCode(10);
            const body = [
              "הסריקה של וינה נכשלה ב-" + new Date().toISOString().slice(0, 16) + ".",
              "",
              "[צפייה בפרטי הריצה](" + process.env.RUN_URL + ")"
            ].join(NL);
            const {data: open} = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "scrape-failure" });
            if (open.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open[0].number, body });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: "⚠️ סריקת וינה נכשלה", body,
                labels: ["scrape-failure"], assignees: [context.repo.owner] });
            }
